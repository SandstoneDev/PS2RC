# =====================================================================================================
#  Настройки игры (файл ps2rc.cfg лежит рядом с EBOOT.PBP)
# =====================================================================================================
#  Файл можно менять обычным Блокнотом: поменять число после "=", сохранить, запустить игру заново.
#  - строки, начинающиеся с "#", - пояснения, игра их пропускает;
#  - пробелы вокруг "=" допустимы, большие/маленькие буквы в названии не важны;
#  - если одна настройка написана два раза, действует нижняя строка;
#  - число вне допустимого диапазона игра сама поправит до ближайшей границы;
#  - в файле session.log при каждом запуске есть строка "settings: ..." - там видно, что реально действует
#    (звёздочка * значит: настройки нет в файле, стоит значение по умолчанию).
#  Ниже стоят наши значения - с ними игра идёт на PSP лучше всего. В каждом пункте указано, как было на PS2.
#  Служебные настройки запуска лежат отдельно, в ps2rc_dev.cfg - их менять не нужно.

# -----------------------------------------------------------------------------------------------------
#  ГРАФИКА
# -----------------------------------------------------------------------------------------------------
# draw_distance - дальность прорисовки мира, в процентах от PS2. От 10 до 100. На PS2: 100. У нас: 40.
#   Больше - дальше видно, но игра медленнее. Меньше - быстрее, туман ближе.
draw_distance=40

# fog - где начинается туман, в процентах. От 10 до 400. На PS2: 100. У нас: 250.
#   Больше - туман дальше и прозрачнее, короткая дальность не выглядит серой стеной.
fog=250

# fog_limit - туман начинается не дальше этой доли дальности прорисовки, в процентах. 0 = выключено.
#   От 0 до 100. На PS2: 0. У нас: 80 (дальний край мира мягко уходит в туман).
fog_limit=80

# detail - на каком расстоянии модели заменяются на упрощённые, в процентах. От 30 до 200. На PS2: 100.
#   У нас: 100. Меньше - быстрее, но вблизи предметы становятся размытыми. Больше - чётче, но медленнее.
detail=100

# drive_distance - дальность прорисовки при быстрой езде, в процентах от draw_distance. 0 = выключено.
#   От 0 до 100. На PS2: 0. У нас: 75 - в машине на скорости быстрее, туман чуть ближе.
drive_distance=75

# textures - чёткость текстур мира: full = как на PS2, half = вдвое меньше (быстрее, вблизи мягче),
#   low = ещё мягче. На PS2: full. У нас: full.
textures=full

# mipmaps - сглаживание дальних текстур: 1 = вкл (дальние поверхности не рябят), 0 = выкл.
#   У нас: 1 (скорость та же, вблизи чётче, чем с textures=half).
mipmaps=1

# mirrors - зеркала в помещениях: 1 = есть, 0 = нет. На PS2: 1. У нас: 0 - в помещениях с зеркалами
#   игра идёт заметно быстрее, на улице разницы нет.
mirrors=0

# water - вода: 1 = рисовать, 0 = нет. На PS2: 1. У нас: 1 (почти не замедляет).
water=1

# shadows - тени машин и людей, следы самолётов: 1 = вкл, 0 = выкл. На PS2: 1. У нас: 1.
#   0 - немного быстрее, но без теней.
shadows=1

# -----------------------------------------------------------------------------------------------------
#  НАСЕЛЕНИЕ И ДАЛЬНИЙ МИР
# -----------------------------------------------------------------------------------------------------
# peds - сколько пешеходов на улицах, в процентах от PS2. От 0 до 100. На PS2: 100. У нас: 25.
#   Больше - живее город, но заметно медленнее.
peds=25

# traffic - сколько машин на дорогах, в процентах от PS2. От 0 до 100. На PS2: 100. У нас: 25.
#   Больше - больше машин, но медленнее.
traffic=25

# far_ai - люди и предметы дальше стольких метров "думают" через кадр. 0 = выключено. От 0 до 400.
#   На PS2: 0. У нас: 20 - быстрее, на глаз незаметно.
far_ai=20

# far_freeze - предметы дальше стольких метров замирают, пока не подойдёшь. 0 = выключено. От 0 до 2000.
#   На PS2: 0. У нас: 300 - быстрее; очень далёкие предметы не падают и не катятся.
far_freeze=300

# far_collision - столкновения дальних людей и машин считаются через кадр дальше стольких метров.
#   0 = выключено. От 0 до 400. На PS2: 0. У нас: 20 - быстрее, на глаз незаметно.
far_collision=20

# camera_reuse - камера не пересчитывает столкновение со стенами, пока сдвинулась меньше стольких сантиметров.
#   0 = выключено. От 0 до 400. На PS2: 0. У нас: 25 - быстрее; камера может отстать максимум на один кадр.
camera_reuse=25

# -----------------------------------------------------------------------------------------------------
#  ПРОИЗВОДИТЕЛЬНОСТЬ
# -----------------------------------------------------------------------------------------------------
# show_fps - счётчик кадров в секунду в левом верхнем углу при запуске: 1 = да, 0 = нет.
#   В игре включается и выключается так: держать L+R и нажать SELECT. У нас: 0.
show_fps=0

# fps_cap - ограничение кадров в секунду: 30 (как в оригинале), 25, 20, 15 или 60 (эксперимент).
#   Другие числа округляются вниз до ближайшего из этих. off - без ограничения. У нас: 30.
#   25 - кадры чуть неровные на экране PSP (60 Гц), скорость игры точная.
#   60 - экспериментально: часы игры идут на 3-4 % медленнее, часть логики игры может идти чаще.
fps_cap=30

# -----------------------------------------------------------------------------------------------------
#  РАЗГОН ПРОЦЕССОРА
# -----------------------------------------------------------------------------------------------------
# overclock - автоматический разгон процессора PSP: 0 = без разгона (333 МГц), 342 или 365 (МГц).
#   У нас: 0. Разгон даёт заметно больше кадров в секунду. Работает только на прошивке ARK.
#   РИСК: на некоторых приставках разгон может выключить PSP. Защита: если игра на разгоне упала или
#   приставка выключилась в первую минуту игры, следующий запуск идёт на ступень ниже (365 -> 342),
#   после второго сбоя разгон отключается сам. Включаете на свой риск.
overclock=0
# overclock_reset - поменяйте число (1, 2, ...), чтобы снова разрешить разгон после того, как он отключился сам.
#overclock_reset=1

# -----------------------------------------------------------------------------------------------------
#  УПРАВЛЕНИЕ
# -----------------------------------------------------------------------------------------------------
# select_up - что делает SELECT + Вверх: stick = правый стик вверх (как сейчас), r3 = кнопка R3
#   (подмиссии такси, скорой, пожарных, полиции), l3 = кнопка L3 (гудок). SELECT + Круг - это всегда R3.
#   У нас: не задано (= stick). Чтобы включить, уберите "#" в начале строки.
#select_up=r3

# -----------------------------------------------------------------------------------------------------
#  ЗВУК И ВИДЕО
# -----------------------------------------------------------------------------------------------------
# sound - звук: 1 = вкл, 0 = выкл. У нас: 1.
sound=1
# volume - громкость от 0 до 100. На PS2: 100. У нас: 100.
volume=100
# intro_movies - заставки при запуске: 1 = показывать, 0 = нет. Кнопка X пропускает заставку. У нас: 1.
intro_movies=1
