# =====================================================================================================
#  Настройки игры (файл ps2rc.cfg лежит рядом с EBOOT.PBP)
# =====================================================================================================
#  Файл можно менять обычным Блокнотом: поменять число после "=", сохранить, запустить игру заново.
#  Или прямо в игре: держи L + R + X и нажми крестовину вниз (игра на паузе; START в этом меню
#  сохраняет в этот файл, пояснения остаются).
#  - строки, начинающиеся с "#", - пояснения, игра их пропускает;
#  - пробелы вокруг "=" допустимы, большие/маленькие буквы в названии не важны;
#  - если одна настройка написана два раза, действует нижняя строка;
#  - число вне допустимого диапазона игра сама поправит до ближайшей границы;
#  - в файле session.log при каждом запуске есть строка "settings: ..." - там видно, что реально действует
#    (звёздочка * значит: настройки нет в файле, стоит значение по умолчанию).
#  Ниже стоят наши значения - с ними игра идёт на PSP лучше всего. В каждом пункте указано, как было на PS2.
#  Служебные настройки запуска лежат отдельно, в ps2rc_dev.cfg - их менять не нужно.

# -----------------------------------------------------------------------------------------------------
#  ГРАФИКА
# -----------------------------------------------------------------------------------------------------
# draw_distance - дальность прорисовки мира, в процентах от PS2. От 10 до 100. На PS2: 100. У нас: 40.
#   Больше - дальше видно, но игра медленнее. Меньше - быстрее, туман ближе.
draw_distance=40

# fog - где начинается туман, в процентах. От 10 до 400. На PS2: 100. У нас: 250.
#   Больше - туман дальше и прозрачнее, короткая дальность не выглядит серой стеной.
fog=250

# fog_limit - туман начинается не дальше этой доли дальности прорисовки, в процентах. 0 = выключено.
#   От 0 до 100. На PS2: 0. У нас: 80 (дальний край мира мягко уходит в туман).
fog_limit=80

# detail - на каком расстоянии модели заменяются на упрощённые, в процентах. От 30 до 200. На PS2: 100.
#   У нас: 100. Меньше - быстрее, но вблизи предметы становятся размытыми. Больше - чётче, но медленнее.
detail=100

# drive_distance - дальность прорисовки при быстрой езде, в процентах от draw_distance. 0 = выключено.
#   От 0 до 100. На PS2: 0. У нас: 75 - в машине на скорости быстрее, туман чуть ближе.
drive_distance=75

# textures - чёткость текстур мира: full = как на PS2, half = вдвое меньше (быстрее, вблизи мягче),
#   low = ещё мягче. На PS2: full. У нас: full.
textures=full

# mipmaps - сглаживание дальних текстур: 1 = вкл (дальние поверхности не рябят), 0 = выкл.
#   У нас: 1 (скорость та же, вблизи чётче, чем с textures=half).
mipmaps=1

# mirrors - зеркала в помещениях: 1 = есть, 0 = нет. На PS2: 1. У нас: 0 - в помещениях с зеркалами
#   игра идёт заметно быстрее, на улице разницы нет.
mirrors=0

# water - вода: 1 = рисовать, 0 = нет. На PS2: 1. У нас: 1 (почти не замедляет).
water=1

# shadows - тени машин и людей, следы самолётов: 1 = вкл, 0 = выкл. На PS2: 1. У нас: 1.
#   0 - немного быстрее, но без теней.
shadows=1

# dither - мелкая сетка точек, которой PSP прячет ступеньки цвета 16-битной картинки. opaque = только на
#   сплошных поверхностях (дым, дымка и другие полупрозрачные эффекты чистые), on = везде (дым выглядит
#   клетчатым), off = нигде (на плавных переходах, например небе, могут быть ступеньки). Скорость та же.
#   У нас: opaque (важно при color_depth=16; у 32-битной картинки сетки точек нет).
dither=opaque

# color_depth - точность цвета при рисовании картинки: 16 или 32 бита. 32 = полупрозрачное смешивается точно,
#   сетки точек нет совсем, но графический чип гоняет вдвое больше данных пикселей (чуть медленнее там, где он
#   занят; замер на PSP-3000: разницы в скорости не видно). У нас: 32.
color_depth=32

# lamp_distance - фонари, светофоры и неоновые вывески (свечение, пятно света на земле и сам свет) рисуются
#   только до этого расстояния в метрах: 0 = выкл. (как в оригинале). Быстрее ночью. У нас: выкл.
#   Быстрое значение: 60.
#lamp_distance=60

# light_pools - пятна света от фонарей на земле рисуются до этой доли исходного расстояния, в процентах:
#   0 = выкл. (как в оригинале). Быстрее ночью. У нас: выкл. Быстрое значение: 50.
#light_pools=50

# -----------------------------------------------------------------------------------------------------
#  HUD (РАДАР, ДЕНЬГИ, ЧАСЫ, ЗДОРОВЬЕ, СТАТИСТИКА) НА ЭКРАНЕ PSP
# -----------------------------------------------------------------------------------------------------
# hud_aspect - игра рисует HUD для телевизора 4:3, а экран PSP шире.
#   fix = HUD сохраняет пропорции 4:3 в углах экрана, радар круглый; stretch = растянут на всю ширину
#   (радар - широкий овал). У нас: fix.
hud_aspect=fix

# hud_scale - размер HUD в углах (деньги, часы, здоровье, оружие, радар, статистика, подсказки), в процентах.
#   От 50 до 200. На PS2: 100. У нас: 125 (на маленьком экране легче читать).
hud_scale=125

# hud_outline - тонкая чёрная обводка текста HUD (деньги, часы, патроны, названия): 1 = вкл, 0 = выкл.
#   У нас: 1.
hud_outline=1

# hud_radar - форма радара при hud_aspect=fix: round = круглый на экране PSP, ps2 = пропорции как на
#   телевизоре. У нас: round.
hud_radar=round

# -----------------------------------------------------------------------------------------------------
#  НАСЕЛЕНИЕ И ДАЛЬНИЙ МИР
# -----------------------------------------------------------------------------------------------------
# peds - сколько пешеходов на улицах, в процентах от PS2. От 0 до 100. На PS2: 100. У нас: 25.
#   Больше - живее город, но заметно медленнее.
peds=25

# traffic - сколько машин на дорогах, в процентах от PS2. От 0 до 100. На PS2: 100. У нас: 25.
#   Больше - больше машин, но медленнее.
traffic=25

# far_ai - люди и предметы дальше стольких метров "думают" через кадр. 0 = выключено. От 0 до 400.
#   На PS2: 0. У нас: 20 - быстрее, на глаз незаметно.
far_ai=20

# far_freeze - предметы дальше стольких метров замирают, пока не подойдёшь. 0 = выключено. От 0 до 2000.
#   На PS2: 0. У нас: 300 - быстрее; очень далёкие предметы не падают и не катятся.
far_freeze=300

# far_collision - столкновения дальних людей и машин считаются через кадр дальше стольких метров.
#   0 = выключено. От 0 до 400. На PS2: 0. У нас: 20 - быстрее, на глаз незаметно.
far_collision=20

# camera_reuse - камера не пересчитывает столкновение со стенами, пока сдвинулась меньше стольких сантиметров.
#   0 = выключено. От 0 до 400. На PS2: 0. У нас: 25 - быстрее; камера может отстать максимум на один кадр.
camera_reuse=25

# -----------------------------------------------------------------------------------------------------
#  ПРОИЗВОДИТЕЛЬНОСТЬ
# -----------------------------------------------------------------------------------------------------
# show_fps - счётчик кадров в секунду в левом верхнем углу при запуске: 1 = да, 0 = нет.
#   В игре включается и выключается так: держать L+R и нажать SELECT. У нас: 0.
show_fps=0

# fps_cap - ограничение кадров в секунду: 30 (как в оригинале), 25, 20, 15 или 60 (эксперимент).
#   Другие числа округляются вниз до ближайшего из этих. off - без ограничения. У нас: 30.
#   25 - кадры чуть неровные на экране PSP (60 Гц), скорость игры точная.
#   60 - экспериментально: часы игры идут на 3-4 % медленнее, часть логики игры может идти чаще.
fps_cap=30

# -----------------------------------------------------------------------------------------------------
#  РАЗГОН ПРОЦЕССОРА
# -----------------------------------------------------------------------------------------------------
# overclock - собственный разгон процессора игрой: 0 = выкл. (игра не трогает частоту), 342 или 365 (МГц).
#   У нас: 0. При 0 игра частоту не задаёт: действует то, что выставлено в меню ARK для игр (CPU clock
#   in game); если в ARK ничего не выставлено, игра идёт на 333 МГц (гарантированный максимум PSP).
#   Лучше сначала попробовать настройку в меню ARK: она своя для каждой приставки.
#   РИСК: у каждой PSP свой предел (гарантированы только 333 МГц; две одинаковые приставки могут
#   отличаться на 40 МГц и больше), разгон может выключить PSP или уронить игру. На PS Vita (Adrenaline)
#   не используется никогда. Работает только на ARK, на проверенной плате PSP-3000 и только если в меню ARK
#   частота для игр не выставлена. Защита: если игра на разгоне упала или приставка выключилась в первую
#   минуту игры, следующий запуск идёт на ступень ниже (365 -> 342), после второго сбоя разгон отключается
#   сам. Включаете на свой риск.
overclock=0
# overclock_reset - поменяйте число (1, 2, ...), чтобы снова разрешить разгон после того, как он отключился сам.
#overclock_reset=1

# -----------------------------------------------------------------------------------------------------
#  УПРАВЛЕНИЕ
# -----------------------------------------------------------------------------------------------------
# На PSP нет L2, R2, L3, R3 и правого стика. Выберите готовую раскладку (controls_preset), а потом
#   переставьте любую кнопку PS2 на любую кнопку или комбинацию PSP (настройки map_ ниже).
#   Комбинация - от одной до трёх кнопок через "+", из: select start l r up down left right triangle
#   circle cross square (вверх, вниз, влево, вправо, треугольник, круг, крест, квадрат), и аналоговый
#   стик: analog (сдвинут куда угодно), analog_left, analog_right, analog_up, analog_down (сильно
#   отклонён влево, вправо, вверх, вниз). Например: select+l, l+r, r+square, l+analog_left. Добавьте
#   +tap, чтобы срабатывало только короткое нажатие без других кнопок (l+tap), или +hold - короткое
#   нажатие или удержание одной этой кнопки чуть дольше (l+hold). Два-три способа нажать одну кнопку
#   PS2 - через "/" (left/select+l).
#   Чтобы включить настройку, уберите "#" в начале её строки. Не занимайте L+R+SELECT (показать /
#   спрятать счётчик кадров), HOME и L+R+Вниз+START (меню самой приставки). Если две настройки на одних и
#   тех же кнопках или значение непонятно игре - эта настройка остаётся как было. Что получилось, видно в
#   session.log в строках "controls: ..." и "controls in a vehicle: ...".
#   Настройки map_ работают пешком и в машине. Те же имена с car_ вместо map_ (car_l2, car_up,
#   car_rstick, ...) работают только в транспорте; car_...=foot (или нет строки) = как пешком.
#   Пример: SELECT больше не меняет вид камеры, L2 на L+R, R2 на R+Квадрат:
#     select_to_game=tap
#     map_l2=l+r
#     map_r2=r+square

# controls_preset - раскладка, от которой начинать: default = комбинации с SELECT (держите SELECT и
#   нажмите L - это L2, R - R2, Треугольник - L3, Круг - R3, крестовина - правый стик), stories = как в играх,
#   сделанных для самой PSP (держите L и двигайте аналоговый стик - поворот камеры). У нас: default.
#   stories пешком - аналог: идти, L + аналог: камера, Крест: бег, Квадрат: прыжок, Треугольник: сесть в
#   машину, Круг: удар / выстрел, R: прицел, крестовина влево / вправо: прошлое / следующее оружие или
#   цель, вниз: присесть, вверх: позвать в банду (целясь в бойца), L + R держать: взгляд назад, L нажать
#   или подержать одну: L1, L + крестовина: сама крестовина (ответы да / нет, танцы, меню).
#   stories в транспорте - Крест: газ, Квадрат: тормоз, R: ручник, Круг: оружие машины, L + аналог влево /
#   вправо / вниз: взгляд влево / вправо / назад (руль направления в самолёте и вертолёте), крестовина
#   влево / вправо: радиостанция, вниз: гудок, вверх: подмиссия, L нажать или подержать одну: L1 (нитро,
#   прыжок на велосипеде), L + крестовина: правый стик (турель, сопла самолёта), L + R + крестовина влево /
#   вправо: Влево / Вправо (пропустить поездку).
#controls_preset=stories

# camera_invert - камера на аналоговом стике (stories: держите L и двигайте стик; и любой map_rstick /
#   car_rstick вида <кнопка>+analog) с обратными осями: off, x = влево / вправо наоборот, y = вверх / вниз
#   наоборот, xy = обе. Камера на крестовине и кнопки обзора в машине не меняются. У нас: off.
#camera_invert=off

# modifier - в раскладке default кнопка-модификатор: её держат для встроенных комбинаций. select = SELECT
#   (как сейчас), l = L, r = R, none = встроенных комбинаций нет (только те, что заданы ниже). Если это L
#   или R, её место занимает SELECT: при l кнопки L и SELECT дают L2, L и R - R2, L и Треугольник - L3,
#   L и Круг - R3, L и крестовина - правый стик.
#modifier=select

# select_to_game - как сама кнопка SELECT доходит до игры (игра меняет вид камеры по SELECT):
#   always = всегда, пока SELECT нажата, и в комбинациях тоже (как сейчас), tap = только если нажать и
#   отпустить SELECT одну (вид больше не меняется, когда вы жмёте комбинацию).
#select_to_game=tap

# map_l2 - кнопка L2 (пешком: прошлое оружие или цель; в машине: взгляд влево).
#   select+l = SELECT и L (как сейчас), l+r = L и R вместе, select+square = SELECT и Квадрат,
#   left = крестовина влево, none = без L2.
#map_l2=select+l

# map_r2 - кнопка R2 (пешком: следующее оружие или цель; в машине: взгляд вправо).
#   select+r = SELECT и R (как сейчас), r+square = R и Квадрат, select+cross = SELECT и Крест,
#   right = крестовина вправо, none = без R2.
#map_r2=select+r

# map_l3 - кнопка L3, нажатие на левый стик (пешком: присесть; в машине: гудок).
#   select+triangle = SELECT и Треугольник (как сейчас), l+triangle = L и Треугольник,
#   r+triangle = R и Треугольник, down = крестовина вниз, none = без L3.
#map_l3=select+triangle

# map_r3 - кнопка R3, нажатие на правый стик (пешком: взгляд назад; в машине: подмиссии).
#   select+circle = SELECT и Круг (как сейчас), r+circle = R и Круг, l+circle = L и Круг,
#   l+r+hold = L и R держать, none = без R3.
#map_r3=select+circle

# map_rstick - чем двигать правый стик (камера, гидравлика): select+dpad = держать SELECT и жать
#   крестовину (как сейчас), l+dpad = держать L и жать крестовину, r+dpad = держать R и жать крестовину,
#   l+analog = держать L и двигать аналоговый стик, r+analog = держать R и двигать аналоговый стик,
#   analog = держать modifier и двигать аналоговый стик, none = без правого стика.
#map_rstick=select+dpad

# select_up - когда правый стик на крестовине, что делает Вверх: stick = правый стик вверх (как сейчас),
#   r3 = кнопка R3 (подмиссии такси, скорой, пожарных, полиции), l3 = кнопка L3 (гудок).
#select_up=r3

# map_l1 - кнопка L1 (камеру за спину; в транспорте: оружие, нитро, прыжок на велосипеде):
#   l = L (как сейчас), l+hold = короткое нажатие L или удержание одной L,
#   select+l = SELECT и L, none = без L1.
#map_l1=l
# map_r1 - кнопка R1 (прицел; в транспорте: ручник): r = R (как сейчас), select+r = SELECT и R, none = без R1.
#map_r1=r
# map_select - кнопка SELECT (вид камеры): select = SELECT (как сейчас), start = START, none = без SELECT.
#   Чтобы поменять две кнопки местами, задайте обе (map_select=start и map_start=select).
#map_select=select
# map_start - кнопка START (меню паузы): start = START (как сейчас), select = SELECT, none = без START.
#map_start=start
# map_cross - кнопка Крест (бег, газ): cross = Крест (как сейчас), square = Квадрат, none = без Креста.
#map_cross=cross
# map_circle - кнопка Круг (удар, оружие машины): circle = Круг (как сейчас), cross = Крест,
#   none = без Круга.
#map_circle=circle
# map_square - кнопка Квадрат (прыжок, тормоз): square = Квадрат (как сейчас), cross = Крест,
#   none = без Квадрата.
#map_square=square
# map_triangle - кнопка Треугольник (сесть в машину / выйти): triangle = Треугольник (как сейчас),
#   circle = Круг, none = без Треугольника.
#map_triangle=triangle
# map_up - крестовина вверх на PS2 (позвать в банду; в машине: радио): up = вверх (как сейчас),
#   l+up = L и вверх, none = без вверх.
#map_up=up
# map_down - крестовина вниз на PS2 (банда: стоять; в машине: радио): down = вниз (как сейчас),
#   l+down = L и вниз, none = без вниз.
#map_down=down
# map_left - крестовина влево на PS2 (ответ "нет"): left = влево (как сейчас), l+left = L и влево,
#   none = без влево.
#map_left=left
# map_right - крестовина вправо на PS2 (ответ "да", пропустить поездку): right = вправо (как сейчас),
#   l+right = L и вправо, none = без вправо.
#map_right=right
# map_lstick - левый стик PS2 (ходьба, руль): analog = аналоговый стик (как сейчас), dpad = крестовина
#   (сначала переставьте кнопки крестовины в другое место), none = без левого стика.
#map_lstick=analog

# -----------------------------------------------------------------------------------------------------
#  ЗВУК И ВИДЕО
# -----------------------------------------------------------------------------------------------------
# sound - звук: 1 = вкл, 0 = выкл. У нас: 1.
sound=1
# volume - громкость от 0 до 100. На PS2: 100. У нас: 100.
volume=100
# intro_movies - заставки при запуске: 1 = показывать, 0 = нет. Кнопка X пропускает заставку. У нас: 1.
intro_movies=1
