# poc6_dev.cfg - run options (developer). Read BEFORE poc6.cfg; a key in both: poc6.cfg wins.
# Keep this file next to EBOOT.PBP together with poc6.cfg. No changes needed for playing.
# --- run / log
vcallms=hle
mainloop_iterations=0
max_seconds=36000
pace=1
verbose=0
stuck_seconds=120
screen=1
render=ge
ge_text=0
audio_stats=30
audio_log=1
log_sync=2
log_commit_ms=500
disc_async=1
az_exit=1
# --- memory: bigger game heap + streaming budget (mem_volatile=1 blocks sleep by the power switch: exit with HOME)
tune_strmem=13550
mem_volatile=1
heap_extra_kb=4288
# --- game speed = real time: 60 Hz game limit + virtual time follows the real clock (the frame cap is fps_cap)
x_pal50=0
x_pace=2
# --- loading screens at real time (loading music was 4-6x too fast)
x_bootpace=2
