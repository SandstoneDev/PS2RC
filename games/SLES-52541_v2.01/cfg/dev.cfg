# ps2rc_dev.cfg - run options (developer). Read BEFORE ps2rc.cfg; a key in both: ps2rc.cfg wins.
# Keep this file next to EBOOT.PBP together with ps2rc.cfg. No changes needed for playing.
# --- run / log
vcallms=hle
mainloop_iterations=0
max_seconds=36000
pace=1
verbose=0
stuck_seconds=120
screen=1
render=ge
ge_text=0
audio_stats=30
audio_log=1
log_sync=2
log_commit_ms=500
disc_async=1
az_exit=1
# --- memory: bigger game heap + streaming budget (mem_volatile=1 blocks sleep by the power switch: exit with HOME)
tune_strmem=13550
mem_volatile=1
heap_extra_kb=4288
# --- game speed = real time: 60 Hz game limit + virtual time follows the real clock (the frame cap is fps_cap)
x_pal50=0
x_pace=2
# --- loading screens at real time (loading music was 4-6x too fast)
x_bootpace=2
# --- CPU clock: auto = never overrides the CFW's own clock setting; 333 only where the system left less
#     and the CFW sets nothing; 333 = set 333 at every start (builds <= 53); off = never set any clock.
#     clock_log=0 drops the "clock ..." samples from session.log.
#cpu_clock_base=auto
#clock_log=1
