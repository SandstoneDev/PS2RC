# =====================================================================================================
#  Game settings (this file sits next to EBOOT.PBP)
# =====================================================================================================
#  Edit it with any text editor (Notepad is fine): change the number after "=", save, start the game again.
#  Or change the settings in the game: hold L + R + Cross and press D-pad Down (the game pauses; START in
#  that menu saves into this file and keeps these comments).
#  - lines starting with "#" are explanations, the game skips them;
#  - spaces around "=" are fine, upper / lower case in names does not matter;
#  - if a setting appears twice, the lower line wins;
#  - a number outside the allowed range is moved to the nearest limit by the game;
#  - every start writes a line "settings: ..." to session.log showing what is really in effect
#    (a "*" means: not in this file, the built-in default applies).
#  The values below are our defaults - the game runs best on a PSP with them. Each setting also says what the
#  original console used. Run options for developers live in a separate file and need no changes.

# -----------------------------------------------------------------------------------------------------
#  GRAPHICS
# -----------------------------------------------------------------------------------------------------
# draw_distance - how far the world is drawn, in percent of the original. 10 to 100. Original: 100. Ours: 40.
#   Higher - you see further, but the game is slower. Lower - faster, the fog comes closer.
draw_distance=40

# fog - where the fog starts, in percent. 10 to 400. Original: 100. Ours: 250.
#   Higher - the fog is further away and thinner, so a short draw distance does not look like a grey wall.
fog=250

# fog_limit - the fog starts no further than this share of the draw distance, in percent. 0 = off.
#   0 to 100. Original: 0. Ours: 80 (the far edge of the world fades softly into the fog).
fog_limit=80

# detail - distance at which models switch to simpler ones, in percent. 30 to 200. Original: 100. Ours: 100.
#   Lower - faster, but objects close by get blurry. Higher - sharper, but slower.
detail=100

# drive_distance - draw distance while driving fast, in percent of draw_distance. 0 = off. 0 to 100.
#   Original: 0. Ours: 75 - faster in a fast car, the fog comes a little closer.
drive_distance=75

# textures - sharpness of the world's textures: full = as on the original, half = half size (faster,
#   softer close up), low = softer still. Original: full. Ours: full.
textures=full

# mipmaps - smoothing of distant textures: 1 = on (distant surfaces do not shimmer), 0 = off.
#   Ours: 1 (same speed, sharper close up than textures=half).
mipmaps=1

# mirrors - mirrors in interiors: 1 = on, 0 = off. Original: 1. Ours: 0 - interiors with mirrors run much
#   faster; outdoors there is no difference.
mirrors=0

# water - water surfaces: 1 = drawn, 0 = not drawn. Original: 1. Ours: 1 (barely slower).
water=1

# shadows - shadows of cars and people, plane trails: 1 = on, 0 = off. Original: 1. Ours: 1.
#   0 - a little faster, but no shadows.
shadows=1

# dither - the fine dot pattern that hides the colour steps of the PSP's 16-bit picture. opaque = only on
#   solid surfaces (smoke, haze and other see-through effects stay clean), on = on everything (smoke looks
#   dotted), off = nowhere (smooth gradients such as the sky may show steps). Same speed. Ours: opaque
#   (it matters with color_depth=16; the 32-bit picture has no dot pattern).
dither=opaque

# color_depth - colour precision while the picture is drawn: 16 or 32 bits. 32 = see-through effects blend
#   exactly and no dot pattern is left at all, but the graphics chip moves twice the pixel data (a little slower
#   where it is busy; measured on a PSP-3000: no visible difference in speed). Ours: 32.
color_depth=32

# lamp_distance - street lamps, traffic lights and neon signs (their glow, the pool of light on the ground and
#   the light itself) are drawn only up to this many metres: 0 = off (as the original). Faster at night.
#   Ours: off. A fast value: 60.
#lamp_distance=60

# light_pools - the pools of light the lamps put on the ground are drawn up to this share of the original
#   distance, in percent: 0 = off (as the original). Faster at night. Ours: off. A fast value: 50.
#light_pools=50

# -----------------------------------------------------------------------------------------------------
#  HUD (radar, money, clock, health, stats) ON THE PSP SCREEN
# -----------------------------------------------------------------------------------------------------
# hud_aspect - the original lays out its HUD for a 4:3 TV picture; the PSP screen is wider.
#   fix = the HUD keeps its 4:3 proportions in the screen corners and the radar is round; stretch = stretched to
#   the full width (the radar is a wide oval). Ours: fix.
hud_aspect=fix

# hud_scale - size of the HUD in the corners (money, clock, health, weapon, radar, stats, help box), in percent.
#   50 to 200. Original: 100. Ours: 125 (easier to read on the small screen).
hud_scale=125

# hud_outline - a thin black outline around the HUD text (money, clock, ammo, names): 1 = on, 0 = off.
#   Ours: 1.
hud_outline=1

# hud_radar - shape of the radar with hud_aspect=fix: round = round on the PSP screen, ps2 = the same
#   proportions as on a TV. Ours: round.
hud_radar=round

# -----------------------------------------------------------------------------------------------------
#  POPULATION AND THE FAR WORLD
# -----------------------------------------------------------------------------------------------------
# peds - how many pedestrians, in percent of the original. 0 to 100. Original: 100. Ours: 25.
#   Higher - a livelier city, but clearly slower.
peds=25

# traffic - how many cars on the roads, in percent of the original. 0 to 100. Original: 100. Ours: 25.
#   Higher - more cars, but slower.
traffic=25

# far_ai - people and objects further than this many metres "think" every second frame. 0 = off.
#   0 to 400. Original: 0. Ours: 20 - faster, not visible.
far_ai=20

# far_freeze - objects further than this many metres stand still until you come closer. 0 = off.
#   0 to 2000. Original: 0. Ours: 300 - faster; very distant objects do not fall or roll.
far_freeze=300

# far_collision - collisions of distant people and cars are checked every second frame beyond this many
#   metres. 0 = off. 0 to 400. Original: 0. Ours: 20 - faster, not visible.
far_collision=20

# camera_reuse - the camera keeps its wall check while it moved less than this many centimetres. 0 = off.
#   0 to 400. Original: 0. Ours: 25 - faster; the camera may lag by one frame at most.
camera_reuse=25

# -----------------------------------------------------------------------------------------------------
#  PERFORMANCE
# -----------------------------------------------------------------------------------------------------
# show_fps - frames-per-second counter in the top-left corner at start: 1 = yes, 0 = no.
#   In game: hold L+R and press SELECT to show / hide it. Ours: 0.
show_fps=0

# fps_cap - frames-per-second limit: 30 (as the original), 25, 20, 15 or 60 (experimental).
#   Other numbers are rounded down to the nearest of these. off = no limit. Ours: 30.
#   25 shows slightly uneven frames on the PSP's 60 Hz screen; game speed stays exact.
#   60 is experimental: the game clock runs 3-4 % slow and some game logic may run more often.
fps_cap=30

# -----------------------------------------------------------------------------------------------------
#  OVERCLOCK
# -----------------------------------------------------------------------------------------------------
# overclock - the game's own CPU overclock: 0 = off (the game leaves the clock to the system), 342 or 365 (MHz).
#   Ours: 0. With 0 the game never overclocks: whatever ARK's own menu sets for games (CPU clock in game)
#   applies; without an ARK setting the game runs at 333 MHz (the PSP's guaranteed maximum).
#   Better: try ARK's menu setting first - it is per console, so you pick what YOUR PSP can do.
#   RISK: every PSP has its own limit (only 333 MHz is guaranteed; two identical consoles can differ by
#   40 MHz and more), so an overclock can switch the PSP off or crash the game. Never used on a PS Vita
#   (Adrenaline). Works only with ARK on the tested PSP-3000 board and not when ARK's menu already sets a
#   clock. Protection: if the game crashes or the console switches off within the first minute of play while
#   overclocked, the next start goes one step lower (365 -> 342); after a second failure the overclock
#   switches itself off. At your own risk.
overclock=0
# overclock_reset - change this number (1, 2, ...) to allow the overclock again after it switched itself off.
#overclock_reset=1

# -----------------------------------------------------------------------------------------------------
#  CONTROLS
# -----------------------------------------------------------------------------------------------------
# The PSP has no L2, R2, L3, R3 and no right stick. Pick a ready layout (controls_preset), then move any
#   PS2 button to any PSP button or combination you like (the map_ settings below).
#   A combination is one to three buttons joined with "+", from: select start l r up down left right
#   triangle circle cross square, and the analog stick: analog (moved any way), analog_left,
#   analog_right, analog_up, analog_down (pushed far that way). Examples: select+l, l+r, r+square,
#   l+analog_left. Add +tap to react only to a short press and release with nothing else (l+tap), or
#   +hold for a short press or for holding it alone a moment (l+hold). Two or three ways to press one
#   PS2 button: join them with "/" (left/select+l).
#   Remove the "#" in front of a setting to use it. Do not use L+R+SELECT (it shows / hides the fps
#   counter), HOME or L+R+Down+START (the console's own menus). Two settings on the same buttons, or a
#   value the game does not understand: that setting keeps its built-in value. session.log shows the
#   result in the lines "controls: ..." and "controls in a vehicle: ...".
#   The map_ settings work on foot and in a vehicle. The same names with car_ instead of map_ (car_l2,
#   car_up, car_rstick, ...) work only while you are in a vehicle; car_...=foot (or no line) = as on foot.
#   Example: SELECT no longer changes the camera view, L2 on L+R, R2 on R+Square:
#     select_to_game=tap
#     map_l2=l+r
#     map_r2=r+square

# controls_preset - the layout to start from: default = SELECT combinations (hold SELECT and press L for
#   L2, R for R2, Triangle for L3, Circle for R3, the D-pad for the right stick), stories = the classic
#   layout of the PSP's own open-world games (hold L and move the analog stick to turn the camera).
#   Ours: default.
#   stories on foot - analog: walk, L + analog: camera, Cross: sprint, Square: jump, Triangle: enter a
#   vehicle, Circle: attack, R: aim, D-pad left / right: previous / next weapon or target, D-pad down:
#   crouch, D-pad up: recruit (while aiming at a gang member), L + R held: look behind, L tapped or held
#   alone: L1, L + D-pad: the D-pad itself (yes / no answers, dancing, menus).
#   stories in a vehicle - Cross: accelerate, Square: brake, R: handbrake, Circle: car weapon,
#   L + analog left / right / down: look left / right / behind (rudder in aircraft), D-pad left / right:
#   radio station, D-pad down: horn, D-pad up: side mission, L tapped or held alone: L1 (nitrous,
#   bunnyhop), L + D-pad: right stick (turret, jet nozzles), L + R + D-pad left / right: Left / Right (skip a
#   trip).
#controls_preset=stories

# camera_invert - the camera on the analog stick (stories: hold L and move the stick; any map_rstick /
#   car_rstick set to <button>+analog too) with reversed axes: off, x = left / right reversed, y = up / down
#   reversed, xy = both. The D-pad camera and the vehicle look buttons do not change. Ours: off.
#camera_invert=off

# modifier - with the default layout, the button you hold for the built-in combinations: select = SELECT
#   (built-in), l = L, r = R, none = no built-in combinations (only the ones you set below). With L or R,
#   SELECT takes its place: with l, L and SELECT give L2, L and R give R2, L and Triangle L3, L and Circle
#   R3, L and the D-pad the right stick.
#modifier=select

# select_to_game - how SELECT itself reaches the game (the game changes the camera view on SELECT):
#   always = whenever SELECT is held, also in combinations (built-in), tap = only when you press and
#   release SELECT alone (the view no longer changes when you use a combination).
#select_to_game=tap

# map_l2 - the PS2 L2 button (on foot: previous weapon or target; in a car: look left).
#   select+l = SELECT and L (built-in), l+r = L and R together, select+square = SELECT and Square,
#   left = D-pad left, none = no L2.
#map_l2=select+l

# map_r2 - the PS2 R2 button (on foot: next weapon or target; in a car: look right).
#   select+r = SELECT and R (built-in), r+square = R and Square, select+cross = SELECT and Cross,
#   right = D-pad right, none = no R2.
#map_r2=select+r

# map_l3 - the PS2 L3 button, a press on the left stick (on foot: crouch; in a car: horn).
#   select+triangle = SELECT and Triangle (built-in), l+triangle = L and Triangle,
#   r+triangle = R and Triangle, down = D-pad down, none = no L3.
#map_l3=select+triangle

# map_r3 - the PS2 R3 button, a press on the right stick (on foot: look behind; in a car: side missions).
#   select+circle = SELECT and Circle (built-in), r+circle = R and Circle, l+circle = L and Circle,
#   l+r+hold = L and R held, none = no R3.
#map_r3=select+circle

# map_rstick - how you move the right stick (camera, hydraulics): select+dpad = hold SELECT and use the
#   D-pad (built-in), l+dpad = hold L and use the D-pad, r+dpad = hold R and use the D-pad,
#   l+analog = hold L and use the analog stick, r+analog = hold R and use the analog stick,
#   analog = hold the modifier and use the analog stick, none = no right stick.
#map_rstick=select+dpad

# select_up - with the right stick on the D-pad, what Up does: stick = right stick up (built-in),
#   r3 = the R3 button (vehicle side missions), l3 = the L3 button (horn).
#select_up=r3

# map_l1 - the PS2 L1 button (centre the camera; in a vehicle: car weapon, nitrous, bunnyhop):
#   l = L (built-in), l+hold = a short press of L or L held alone, select+l = SELECT and L, none = no L1.
#map_l1=l
# map_r1 - the PS2 R1 button (aim; in a vehicle: handbrake): r = R (built-in), select+r = SELECT and R,
#   none = no R1.
#map_r1=r
# map_select - the PS2 SELECT button (camera view): select = SELECT (built-in), start = START,
#   none = no SELECT.
#   To swap two buttons, set both (map_select=start and map_start=select).
#map_select=select
# map_start - the PS2 START button (pause menu): start = START (built-in), select = SELECT,
#   none = no START.
#map_start=start
# map_cross - the PS2 Cross button (sprint, accelerate): cross = Cross (built-in), square = Square,
#   none = no Cross.
#map_cross=cross
# map_circle - the PS2 Circle button (attack, car weapon): circle = Circle (built-in), cross = Cross,
#   none = no Circle.
#map_circle=circle
# map_square - the PS2 Square button (jump, brake): square = Square (built-in), cross = Cross,
#   none = no Square.
#map_square=square
# map_triangle - the PS2 Triangle button (enter or leave a vehicle): triangle = Triangle (built-in),
#   circle = Circle, none = no Triangle.
#map_triangle=triangle
# map_up - the PS2 D-pad up (recruit a gang member; in a car: radio station): up = D-pad up (built-in),
#   l+up = L and up, none = no up.
#map_up=up
# map_down - the PS2 D-pad down (gang: hold position; in a car: radio station): down = D-pad down
#   (built-in), l+down = L and down, none = no down.
#map_down=down
# map_left - the PS2 D-pad left (answer no): left = D-pad left (built-in), l+left = L and left,
#   none = no left.
#map_left=left
# map_right - the PS2 D-pad right (answer yes; skip a trip): right = D-pad right (built-in),
#   l+right = L and right, none = no right.
#map_right=right
# map_lstick - the PS2 left stick (walk, steer): analog = the analog stick (built-in), dpad = the D-pad
#   (move the D-pad buttons somewhere else first), none = no left stick.
#map_lstick=analog

# -----------------------------------------------------------------------------------------------------
#  SOUND AND VIDEO
# -----------------------------------------------------------------------------------------------------
# sound - 1 = on, 0 = off. Ours: 1.
sound=1
# volume - 0 to 100. Original: 100. Ours: 100.
volume=100
# intro_movies - movies at start: 1 = play, 0 = skip. X skips a movie while it plays. Ours: 1.
intro_movies=1
