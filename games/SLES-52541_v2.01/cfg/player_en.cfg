# =====================================================================================================
#  Game settings (this file sits next to EBOOT.PBP)
# =====================================================================================================
#  Edit it with any text editor (Notepad is fine): change the number after "=", save, start the game again.
#  - lines starting with "#" are explanations, the game skips them;
#  - spaces around "=" are fine, upper / lower case in names does not matter;
#  - if a setting appears twice, the lower line wins;
#  - a number outside the allowed range is moved to the nearest limit by the game;
#  - every start writes a line "settings: ..." to session.log showing what is really in effect
#    (a "*" means: not in this file, the built-in default applies).
#  The values below are our defaults - the game runs best on a PSP with them. Each setting also says what the
#  original console used. Run options for developers live in a separate file and need no changes.

# -----------------------------------------------------------------------------------------------------
#  GRAPHICS
# -----------------------------------------------------------------------------------------------------
# draw_distance - how far the world is drawn, in percent of the original. 10 to 100. Original: 100. Ours: 40.
#   Higher - you see further, but the game is slower. Lower - faster, the fog comes closer.
draw_distance=40

# fog - where the fog starts, in percent. 10 to 400. Original: 100. Ours: 250.
#   Higher - the fog is further away and thinner, so a short draw distance does not look like a grey wall.
fog=250

# fog_limit - the fog starts no further than this share of the draw distance, in percent. 0 = off.
#   0 to 100. Original: 0. Ours: 80 (the far edge of the world fades softly into the fog).
fog_limit=80

# detail - distance at which models switch to simpler ones, in percent. 30 to 200. Original: 100. Ours: 100.
#   Lower - faster, but objects close by get blurry. Higher - sharper, but slower.
detail=100

# drive_distance - draw distance while driving fast, in percent of draw_distance. 0 = off. 0 to 100.
#   Original: 0. Ours: 75 - faster in a fast car, the fog comes a little closer.
drive_distance=75

# textures - sharpness of the world's textures: full = as on the original, half = half size (faster,
#   softer close up), low = softer still. Original: full. Ours: full.
textures=full

# mipmaps - smoothing of distant textures: 1 = on (distant surfaces do not shimmer), 0 = off.
#   Ours: 1 (same speed, sharper close up than textures=half).
mipmaps=1

# mirrors - mirrors in interiors: 1 = on, 0 = off. Original: 1. Ours: 0 - interiors with mirrors run much
#   faster; outdoors there is no difference.
mirrors=0

# water - water surfaces: 1 = drawn, 0 = not drawn. Original: 1. Ours: 1 (barely slower).
water=1

# shadows - shadows of cars and people, plane trails: 1 = on, 0 = off. Original: 1. Ours: 1.
#   0 - a little faster, but no shadows.
shadows=1

# -----------------------------------------------------------------------------------------------------
#  POPULATION AND THE FAR WORLD
# -----------------------------------------------------------------------------------------------------
# peds - how many pedestrians, in percent of the original. 0 to 100. Original: 100. Ours: 25.
#   Higher - a livelier city, but clearly slower.
peds=25

# traffic - how many cars on the roads, in percent of the original. 0 to 100. Original: 100. Ours: 25.
#   Higher - more cars, but slower.
traffic=25

# far_ai - people and objects further than this many metres "think" every second frame. 0 = off.
#   0 to 400. Original: 0. Ours: 20 - faster, not visible.
far_ai=20

# far_freeze - objects further than this many metres stand still until you come closer. 0 = off.
#   0 to 2000. Original: 0. Ours: 300 - faster; very distant objects do not fall or roll.
far_freeze=300

# far_collision - collisions of distant people and cars are checked every second frame beyond this many
#   metres. 0 = off. 0 to 400. Original: 0. Ours: 20 - faster, not visible.
far_collision=20

# camera_reuse - the camera keeps its wall check while it moved less than this many centimetres. 0 = off.
#   0 to 400. Original: 0. Ours: 25 - faster; the camera may lag by one frame at most.
camera_reuse=25

# -----------------------------------------------------------------------------------------------------
#  PERFORMANCE
# -----------------------------------------------------------------------------------------------------
# show_fps - frames-per-second counter in the top-left corner at start: 1 = yes, 0 = no.
#   In game: hold L+R and press SELECT to show / hide it. Ours: 0.
show_fps=0

# fps_cap - frames-per-second limit: 30 (as the original), 25, 20, 15 or 60 (experimental).
#   Other numbers are rounded down to the nearest of these. off = no limit. Ours: 30.
#   25 shows slightly uneven frames on the PSP's 60 Hz screen; game speed stays exact.
#   60 is experimental: the game clock runs 3-4 % slow and some game logic may run more often.
fps_cap=30

# -----------------------------------------------------------------------------------------------------
#  OVERCLOCK
# -----------------------------------------------------------------------------------------------------
# overclock - automatic CPU overclock: 0 = none (333 MHz), 342 or 365 (MHz). Ours: 0.
#   An overclock gives clearly more frames per second. Works only with the ARK custom firmware.
#   RISK: on some consoles an overclock can switch the PSP off. Protection: if the game crashes or the
#   console switches off within the first minute of play while overclocked, the next start goes one step
#   lower (365 -> 342); after a second failure the overclock switches itself off. At your own risk.
overclock=0
# overclock_reset - change this number (1, 2, ...) to allow the overclock again after it switched itself off.
#overclock_reset=1

# -----------------------------------------------------------------------------------------------------
#  CONTROLS
# -----------------------------------------------------------------------------------------------------
# select_up - what SELECT + Up does: stick = right stick up (default), r3 = the R3 button (vehicle side
#   missions), l3 = the L3 button (horn). SELECT + Circle is always R3. Remove the "#" to use it.
#select_up=r3

# -----------------------------------------------------------------------------------------------------
#  SOUND AND VIDEO
# -----------------------------------------------------------------------------------------------------
# sound - 1 = on, 0 = off. Ours: 1.
sound=1
# volume - 0 to 100. Original: 100. Ours: 100.
volume=100
# intro_movies - movies at start: 1 = play, 0 = skip. X skips a movie while it plays. Ours: 1.
intro_movies=1
