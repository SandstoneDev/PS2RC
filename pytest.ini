[pytest]
pythonpath = .
testpaths = tests games/example/tests
markers =
    slow: whole-binary sweeps (minutes)
    wsl: needs the toolchain: the pspdev binutils / psp-gcc and a host gcc (Linux; on Windows through WSL)
    oracle: needs PCSX2 (oracle runs through PINE)
    psp: needs PPSSPP / PSP hardware
    needs_game: needs a game's data (a local game pack under games/ and its disc / work files)
addopts = -ra
