# toolchain.lock.toml - the PSP toolchain the converter is built and checked with (pinned, reproducible).
# Source commits = the `build.txt` of the pspdev install the project's builds use (psp-gcc 15.2.0, GNU ld 2.44).
# fetch_sources.py downloads exactly these commits (GitHub source archives) and checks the sha256 values below;
# an empty sha256 means "not recorded yet": the first fetch prints it and --record writes it here.

[toolchain]
gcc_version = "15.2.0"
binutils_version = "2.44"
target = "psp"                    # --target of binutils and gcc (config.sub: mipsallegrexel-psp-elf)

# the prebuilt Linux / macOS release with the same commits (WSL / Linux players, CI); which release tag carries
# exactly these commits: v20260901 (inferred from the release notes, not stated by pspdev)
[release]
tag = "v20260901"
url = "https://github.com/pspdev/pspdev/releases"
asset_debian = "pspdev-debian-latest.tar.gz"
asset_debian_sha256 = ""

[sources.binutils]
repo = "pspdev/binutils-gdb"
commit = "a8b53fe2b5825fa86337623c743d21a19aeb0daf"
sha256 = "98867e0fa2471a06c8ea2ae0ac138a847e4ea910f7f49102b77eaf8d7e86f2f3"

